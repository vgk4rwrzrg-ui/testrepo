apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-agent-profiles
  namespace: jupyterhub
data:
  default.yaml: |
    agent:
      name: larry
      personality:
        tone: professional
        system_prompt: "You are Larry, an enterprise data assistant."
    engine:
      provider: openai_compat
      model: gpt-4o-mini
      temperature: 0.1
---
