<!doctype html>
<html><head><meta charset="utf-8">
<title>{{ bot.name|default:"AI Assistant" }} — User Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: {{ bot.primary_color|default:"#2563eb" }}; }
  body { margin: 0; font: 15px/1.6 system-ui, sans-serif; color: #1f2430;
         background: #f5f7fb; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    main { background: #1f2937 !important; }
    th { background: #374151 !important; }
    td, th { border-color: #374151 !important; }
    code { background: #374151 !important; }
  }
  header { background: var(--accent); color: #fff; padding: 14px 24px;
           font-weight: 600; }
  main { max-width: 860px; margin: 24px auto; background: #fff;
         padding: 28px 36px; border-radius: 12px;
         box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1, h2, h3 { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; margin: 12px 0; }
  th, td { border: 1px solid #e3e7ef; padding: 6px 10px; text-align: left; }
  th { background: #eef2f9; }
  code { background: #eef2f9; padding: 1px 5px; border-radius: 4px; }
  pre code { display: block; padding: 10px; overflow-x: auto; }
  blockquote { border-left: 3px solid var(--accent); margin: 0;
               padding: 4px 14px; color: #667085; }
</style></head>
<body>
<header>&#128269; {{ bot.name|default:"AI Assistant" }} — User Guide</header>
<main>{{ body|safe }}</main>
</body></html>
